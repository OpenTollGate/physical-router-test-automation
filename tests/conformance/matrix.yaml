# Shared conformance / fault-injection matrix for the TollGate backends.
#
# This file is the single source of truth for the Go-vs-Rust conformance
# matrix. It is co-owned by:
#
#   - OpenTollGate/tollgate-module-basic-go#503  (Go twin)
#   - Amperstrand/tollgate-module-basic-rust#15 (Rust twin, R12)
#
# Rule: do NOT fork this matrix into either backend repo. Lanes consume it
# from here (or a pinned copy with a checksum, never a divergent edit).
# Every change to invariants or scenarios must reference both twin issues.
#
# Scenario IDs are stable identifiers used in verdict tables and
# differential reports: add new scenarios, never rename or recycle IDs.
version: 1

meta:
  owners:
    - repo: OpenTollGate/tollgate-module-basic-go
      issue: 503
    - repo: Amperstrand/tollgate-module-basic-rust
      issue: 15
  subset_rule: >-
    Lanes marked `fast` form the PR-lane subset (duplicate, timeout-retry,
    restart-mid-payment, alias spellings). `full` adds everything else and is
    intended for nightly runs. See tests/conformance/README.md.
  backend_agnostic_rule: >-
    Scenarios may only rely on HTTP, the mint, and process/VM control. No
    backend-internal instrumentation may be required to drive a scenario;
    backend-specific log markers may only be used opportunistically as
    boundary-detection hints.

# Invariants asserted per scenario. Identical wording for both backends;
# the lane maps each invariant to the assertions it can make on observable
# state today and records the rest as `pending` with the blocking issue.
invariants:
  - id: no-fund-loss
    statement: >-
      No funds disappear: mint ledger, wallet balance, and payment records
      reconcile after the scenario settles.
  - id: no-double-count
    statement: >-
      No value is counted twice: one payment never yields two sessions or
      two grants.
  - id: no-output-reuse
    statement: >-
      No deterministic output reuse: the mint observes each blinded message
      set at most once (proxy observation).
  - id: service-or-refund
    statement: >-
      The customer receives service or recoverable value: a session is
      granted, or a refund token / durable credit is recorded.
  - id: operator-spendable
    statement: >-
      The operator wallet remains spendable: no stuck-reserved proofs
      beyond bounded time.
  - id: retry-safe
    statement: Retries do not corrupt wallet or session state.
  - id: restart-converges
    statement: >-
      After a restart, the backend converges to a valid state within
      bounded reconciliation time.

# Fault proxy rule schema (consumed by faultproxy.py, driven at runtime via
# its control endpoint — see README.md):
#   match_path:   substring matched against the request path
#   match_method: optional HTTP method filter
#   action:       drop | drop_response | delay | status | reset | pass | notify
#   status_code:  for action=status (e.g. 429, 500)
#   delay_ms:     for action=delay
#   notify_url:   for action=notify (blocking webhook; lanes use it for
#                 deterministic kill-at-boundary triggers)
#   notify_on:    request | response (default request) — when the notify
#                 webhook fires: before the request is forwarded, or after
#                 the upstream processed it but before the response reaches
#                 the client (the ambiguity window)
#   remaining:    apply to the next N matching requests only (default: all)
#   probability:  0.0..1.0 (default 1.0)
#
# drop = request-side black-hole (the mint never sees the request; clean
# timeout). drop_response = the request reaches the mint and is processed,
# but the response never returns (ambiguous outcome).
scenarios:
  # ---- payment -> kill at transaction boundary -> restart -----------------
  # One scenario per boundary. The lane kills the backend process (SIGKILL)
  # at the boundary, restarts it, then drives the same payment again and
  # lets the system settle before asserting.
  - id: pay-kill-pre-receive
    class: kill-boundary
    subset: full
    description: >-
      Backend is killed after the payment POST arrives but before the wallet
      Receive call exposes any derivation range to the mint.
    fault:
      process_control:
        target: backend
        signal: KILL
        boundary: pre-receive
        boundary_hint: >-
          Kill as soon as the payment request is observed (proxy sees no
          mint traffic for this payment yet, or backend log shows request
          accepted). Venue adapters may approximate with a fixed short delay.
    driver:
      - POST one valid token to the payment endpoint.
      - Kill the backend at the boundary; restart it.
      - Re-POST the same token (customer retry).
      - Let the system settle.
    asserts: [no-fund-loss, no-double-count, no-output-reuse, service-or-refund, restart-converges]

  - id: pay-kill-post-receive-pre-session
    class: kill-boundary
    subset: fast
    description: >-
      Backend is killed after the wallet Receive succeeds (mint has seen the
      inputs) but before a session is granted. This is the fast-subset
      representative of the kill class ("restart-mid-payment"): it is the
      #403 window and the one boundary a venue can drive deterministically
      today, via a proxy notify trigger on the swap response.
    fault:
      process_control:
        target: backend
        signal: KILL
        boundary: post-receive-pre-session
        boundary_hint: >-
          Proxy observes the swap/melt request completing, no session state
          written yet. This is the #403 window.
    driver:
      - POST one valid token to the payment endpoint.
      - Kill the backend at the boundary; restart it.
      - Re-POST the same token.
      - Let the system settle; inspect payment records if available.
    asserts: [no-fund-loss, no-double-count, no-output-reuse, service-or-refund, restart-converges]

  - id: pay-kill-post-session-pre-gate
    class: kill-boundary
    subset: full
    description: >-
      Backend is killed after the session is granted (durable state written)
      but before the gate (NDS) is opened.
    fault:
      process_control:
        target: backend
        signal: KILL
        boundary: post-session-pre-gate
        boundary_hint: >-
          Sessions store shows the session; gate client shows no auth for
          the client MAC yet.
    driver:
      - POST one valid token to the payment endpoint.
      - Kill the backend at the boundary; restart it.
      - Observe whether the gate opens (late grant) or value is returned
        (refund path) after restart.
      - Let the system settle.
    asserts: [no-fund-loss, no-double-count, service-or-refund, restart-converges]

  - id: pay-kill-post-gate-pre-response
    class: kill-boundary
    subset: full
    description: >-
      Backend is killed after the gate is opened for the client MAC but
      before the HTTP payment response is delivered.
    fault:
      process_control:
        target: backend
        signal: KILL
        boundary: post-gate-pre-response
        boundary_hint: >-
          Gate client shows the client authenticated; the paying client
          still holds no HTTP response.
    driver:
      - POST one valid token to the payment endpoint.
      - Kill the backend at the boundary; restart it.
      - Re-POST the same token; observe the response (idempotent success
        vs double-charge refusal).
      - Let the system settle.
    asserts: [no-fund-loss, no-double-count, service-or-refund, restart-converges]

  # ---- swap timeout -> retry ----------------------------------------------
  - id: swap-timeout-retry
    class: fault-proxy
    subset: fast
    description: >-
      The proxy forwards the backend's first swap (or melt) call to the
      mint — the mint processes it — but drops the response, making the
      outcome ambiguous to the backend. The backend must reconcile (check
      state / regenerate from a fresh counter), never blind-retry the same
      derivation range.
    fault:
      proxy:
        - match_path: /v1/swap
          action: drop_response
          remaining: 1
    driver:
      - POST one valid token to the payment endpoint.
      - The proxy drops the first swap response.
      - Wait past the backend's mint-timeout; let the backend reconcile.
      - Let the system settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, restart-converges]

  # ---- duplicate submissions ------------------------------------------------
  - id: duplicate-post-sequential
    class: duplicate
    subset: fast
    description: >-
      The same token is POSTed twice, sequentially (customer retry after a
      lost response).
    fault: {}
    driver:
      - POST one valid token; capture the response.
      - POST the same token again.
      - Compare responses and final state.
    asserts: [no-fund-loss, no-double-count, no-output-reuse, service-or-refund]

  - id: duplicate-post-concurrent
    class: duplicate
    subset: fast
    description: >-
      The same token is POSTed twice concurrently (double-submit race).
    fault: {}
    driver:
      - POST the same token twice in parallel.
      - Capture both responses; let the system settle.
    asserts: [no-fund-loss, no-double-count, no-output-reuse, service-or-refund]

  # ---- mint identity aliases -------------------------------------------------
  - id: mint-alias-spellings
    class: alias
    subset: fast
    description: >-
      The config's mint URL and the token's embedded mint URL differ only by
      spelling (trailing slash, host letter case, default port). The backend
      must treat them as one mint: one keyset/counter/balance copy.
    fault: {}
    driver:
      - Configure the backend with mint URL spelling A (e.g. trailing slash).
      - Mint a token whose embedded URL uses spelling B (e.g. upper-case
        host, no slash).
      - POST the token; let the system settle.
      - Inspect wallet state for duplicated mint entries / balances.
    asserts: [no-fund-loss, restart-converges]
    notes: >-
      Regression class of #375/#480: two spellings of one mint used to
      create two keyset/counter/balance copies. That duplication is fund
      loss by definition (value becomes unreachable or double-keyed).

  # ---- keyset rotation ---------------------------------------------------------
  - id: keyset-rotation-mid-session
    class: keyset-rotation
    subset: full
    description: >-
      The mint rotates to a new keyset (no final_expiry) while a client
      session is active; a subsequent payment must use the new keyset.
    fault:
      mint_control:
        action: rotate-keyset
    driver:
      - Open a session with a payment on keyset 1.
      - Rotate the mint to keyset 2.
      - Pay again; let the system settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund]

  - id: keyset-rotation-final-expiry-held-balance
    class: keyset-rotation
    subset: full
    description: >-
      The mint rotates with final_expiry on the old keyset while the
      operator wallet still holds proofs on it; the backend must swap off
      the dying keyset or surface the risk (#417).
    fault:
      mint_control:
        action: rotate-keyset
        final_expiry: true
    driver:
      - Open a session with a payment on keyset 1.
      - Rotate the mint with final_expiry set on keyset 1.
      - Observe wallet behavior across the expiry.
    asserts: [no-fund-loss, operator-spendable]

  # ---- HTTP-level mint faults ---------------------------------------------------
  - id: http-429-burst
    class: http-fault
    subset: full
    description: >-
      The mint rate-limits: every response is 429 for a burst window.
    fault:
      proxy:
        - match_path: /v1/
          action: status
          status_code: 429
          remaining: 20
    driver:
      - POST a valid token while the 429 burst is armed.
      - Let the burst exhaust; let the backend retry; settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, retry-safe]

  - id: http-500-burst
    class: http-fault
    subset: full
    description: >-
      The mint errors: every response is 500 for a burst window.
    fault:
      proxy:
        - match_path: /v1/
          action: status
          status_code: 500
          remaining: 20
    driver:
      - POST a valid token while the 500 burst is armed.
      - Let the burst exhaust; let the backend retry; settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, retry-safe]

  - id: dns-failure
    class: http-fault
    subset: full
    description: >-
      The mint hostname stops resolving mid-payment (proxy refuses
      connections / upstream unreachable).
    fault:
      proxy:
        - match_path: /v1/
          action: reset
          remaining: 5
    driver:
      - POST a valid token while the reset rule is armed.
      - Let the rule exhaust; let the backend retry; settle.
    asserts: [no-fund-loss, service-or-refund, retry-safe]

  - id: delayed-response-30s
    class: http-fault
    subset: full
    description: >-
      The mint stalls: responses are delayed by 30 seconds.
    fault:
      proxy:
        - match_path: /v1/
          action: delay
          delay_ms: 30000
          remaining: 3
    driver:
      - POST a valid token while the delay rule is armed.
      - Observe backend timeout handling vs the delayed success racing in.
      - Settle; assert on final state, not intermediate responses.
    asserts: [no-fund-loss, no-double-count, no-output-reuse, service-or-refund]

  # ---- mint lifecycle ----------------------------------------------------------
  - id: mint-restart-quote-to-mint
    class: mint-restart
    subset: full
    description: >-
      The mint process restarts between the backend fetching a quote and
      spending/minting against it.
    fault:
      process_control:
        target: mint
        signal: KILL
        boundary: post-quote-pre-spend
        boundary_hint: >-
          Proxy observes the quote request complete and no subsequent
          request yet; restart the mint in that window.
    driver:
      - POST a valid token; kill+restart the mint inside the window.
      - Let the backend handle the dead quote; settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, retry-safe]

  # ---- full-system restart -----------------------------------------------------
  - id: vm-reboot-pending-payment
    class: vm-restart
    subset: full
    description: >-
      The whole router VM reboots while a payment is pending (between
      Receive and response).
    fault:
      vm_control:
        action: reboot
        boundary: mid-payment
    driver:
      - POST a valid token; reboot the VM mid-payment.
      - After boot, re-POST the token; settle.
    asserts: [no-fund-loss, no-double-count, service-or-refund, restart-converges]

  # ---- drain / payout ----------------------------------------------------------
  - id: partial-drain-two-mints
    class: drain
    subset: full
    description: >-
      Wallet drains across two mints; the second mint fails mid-drain.
      Produced tokens from the first mint must survive the failure (#375).
    fault:
      proxy:
        - match_path: /v1/
          action: status
          status_code: 500
          remaining: 10
      notes: apply the 500 rule only to the second mint's route
    driver:
      - Fund the wallet on two mints; trigger a drain/payout.
      - The second mint's calls fail; settle and inspect balances.
    asserts: [no-fund-loss, operator-spendable]

  - id: payout-failure-after-owner-paid
    class: drain
    subset: full
    description: >-
      A payout pays the owner but fails before paying the maintainer; what
      was paid must be recorded, not silently dropped.
    fault:
      proxy:
        - match_path: /v1/melt
          action: drop
          remaining: 1
      notes: drop the maintainer melt only, after the owner melt succeeded
    driver:
      - Trigger a payout where owner melt succeeds and maintainer melt
        is dropped; settle and inspect payout records.
    asserts: [no-fund-loss, operator-spendable]

  # ---- power loss ----------------------------------------------------------------
  - id: hard-power-loss
    class: power-loss
    subset: full
    description: >-
      Hard power-loss simulation (QEMU quit without shutdown, or container
      kill -9 + storage wipe of volatile layers) where practical.
    fault:
      vm_control:
        action: power-loss
        boundary: mid-payment
    driver:
      - POST a valid token; cut power mid-payment.
      - Power on; let the system boot and settle; re-POST.
    asserts: [no-fund-loss, no-double-count, service-or-refund, restart-converges]

  # ---- additions from the Rust host-runner lane (tmbr #15, PRTA #16) ----
  # Added under the ownership rule (add, never rename): the swap-timeout
  # restart variant and the two single-axis alias spellings. The original
  # mint-alias-spellings scenario above remains the umbrella case.
  - id: swap-timeout-then-restart
    class: fault-proxy
    subset: full
    description: >-
      The proxy drops the first swap response (ambiguous outcome); before
      the backend can reconcile in-session, it is killed and restarted —
      recovery must then happen at boot via the durable saga, never by
      re-exposing the same derivation range.
    fault:
      proxy:
        - match_path: /v1/swap
          action: drop_response
          remaining: 1
      process_control:
        target: backend
        signal: KILL
        boundary: post-timeout-pre-reconciliation
        boundary_hint: >-
          Kill shortly after the backend's mint-timeout fires (response
          dropped), before in-session saga recovery completes.
    driver:
      - POST one valid token; the proxy drops the swap response.
      - Kill the backend after its timeout, restart it on the same state.
      - Re-POST the same token; settle.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, restart-converges]

  - id: mint-url-trailing-slash
    class: alias
    subset: fast
    description: >-
      Config mint URL carries a trailing slash; the token's embedded URL
      does not (single-axis variant of mint-alias-spellings).
    fault: {}
    config_variation: trailing_slash
    driver:
      - Start the backend with the trailing-slash config spelling.
      - Mint a token whose embedded URL has no slash; POST it; settle.
      - Assert one wallet/balance copy (no second DB for the same mint).
    asserts: [no-fund-loss, restart-converges]

  - id: mint-url-host-case
    class: alias
    subset: fast
    description: >-
      Config mint host is uppercase; the token's embedded host is
      lowercase (single-axis variant of mint-alias-spellings).
    fault: {}
    config_variation: host_case
    driver:
      - Start the backend with the uppercase-host config spelling.
      - Mint a token whose embedded URL is lowercase; POST it; settle.
      - Assert one wallet/balance copy (no second DB for the same mint).
    asserts: [no-fund-loss, restart-converges]

  # ---- adversarial additions, 2026-11 (tollgate-module-basic-go#503,
  # tollgate-module-basic-rust#15) -------------------------------------------
  # Derived from the CDK saga model (crates/cdk/src/wallet/melt/saga/), the
  # error_codes.md renumbering (10002 -> 11003/11008), the conduition NUT-13
  # keyset-collision disclosure (2026-01), and TollGate #1222/#1224. The
  # `body` field on action=status (faultproxy.py) is what makes the
  # mint-SHAPED responses below drivable; generic fault markers cannot
  # exercise classification or recovery logic that parses mint bodies.

  - id: issuer-400-keyset-unknown
    class: http-fault
    subset: fast
    description: >-
      A definitive issuer refusal wearing a mint's clothes: the proxy
      answers the backend's POST /v1/swap with 400 and a NUT-style body
      ({"code": 0, "detail": "keyset <id> unknown"}) while the mint itself
      stays up (other paths pass through untouched). The #1222 shape: a
      definitive 4xx from the mint is NOT an outage and NOT an ambiguity —
      the intent must resolve abandoned/resubmittable, and after the fault
      clears the SAME token must still be receivable (observed failure:
      permanently refused against an UNSPENT token).
    fault:
      proxy:
        - match_path: /v1/swap
          match_method: POST
          action: status
          status_code: 400
          body: {code: 0, detail: "keyset 007311aa2fa58cc8 unknown"}
          remaining: 3
    driver:
      - POST one valid token while the 400 rule is armed; capture the
        notice/classification the backend reports (issuer fault, not
        mint-unreachable).
      - Replay the same token while the fault is still armed (must be
        refused, never half-applied).
      - Disarm the rule; replay the SAME token once more.
      - Assert NUT-07 on the token still answers UNSPENT until the backend
        redeems it, and the final replay succeeds or refunds.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund, retry-safe]
    notes: >-
      Regression class of tollgate-module-basic-go#1222 (LEG F finding):
      the misclassification routed a definitive refusal into the
      outage/ambiguous handling and stranded value at the mint. Needs
      faultproxy's status action with a body — added 2026-11.

  - id: melt-quote-failed-with-payment-proof
    class: fault-proxy
    subset: full
    description: >-
      The mint says the melt FAILED but hands over a payment_proof anyway.
      CDK's hardest-won guard (melt saga: "compensating would let the
      wallet re-spend proofs the mint has already used"): a FAILED/UNPAID
      quote that carries a payment_preimage is an irreversible settlement
      artifact — the wallet must keep the proofs reserved (stay pending)
      and eventually finalize as paid, never release and re-spend them.
    fault:
      proxy:
        - match_path: /v1/melt
          match_method: POST
          action: drop_response
          remaining: 1
        - match_path: /v1/melt/quote
          match_method: GET
          action: status
          status_code: 200
          body: >-
            {"state": "FAILED", "payment_proof": {"preimage":
            "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"}}
          remaining: 5
    driver:
      - Trigger an outgoing melt; the proxy swallows the melt response
        (ambiguous outcome).
      - The backend's quote-state reconciliation reads the shaped FAILED
        + payment_proof body.
      - Observe that inputs must NOT be released for re-spend; the
        operation must not be compensated to failed.
      - Settle; assert final value state reconciles (paid or explicitly
        operator-visible pending with the artifact recorded).
    asserts: [no-fund-loss, no-output-reuse, operator-spendable]
    notes: >-
      "Most implementations miss it" (CDK resume.rs guards the onchain
      reorg/replacement case; Nutshell's wallet would unreserve). Lanes
      without a melt path may record skip-venue.

  - id: swap-replay-rejected-ladder
    class: fault-proxy
    subset: fast
    description: >-
      A NUT-19-blind mint: the wallet replays the ORIGINAL swap request
      after a dropped response (the correct first move), but the mint
      rejects the replay with 11008 "duplicate outputs" (legacy 10002).
      The wallet must fall through the ladder — NUT-07 checkstate on the
      inputs, then NUT-09 restore of the SAME outputs — and must NEVER
      derive a fresh output range for the same operation.
    fault:
      proxy:
        - match_path: /v1/swap
          match_method: POST
          action: drop_response
          remaining: 1
        - match_path: /v1/swap
          match_method: POST
          action: status
          status_code: 400
          body: {code: 11008, detail: "Outputs already signed"}
          remaining: 2
    driver:
      - POST one valid token; the first swap response is dropped.
      - The backend's reconciliation replays the original swap; the proxy
        answers 11008.
      - Observe the recovery ladder — checkstate on inputs, restore of the
        same outputs, or a compensated retry with a provably fresh range.
      - Assert via proxy observations that the original B_ set may legitimately be
        sighted twice (drop + replay); a THIRD, previously-unseen B_ set
        for the same operation is re-derivation only if the inputs were
        proven spent — the lane must distinguish, not blanket-assert.
    asserts: [no-fund-loss, no-output-reuse, service-or-refund]
    notes: >-
      TollGate's documented rule ("on 10002 regenerate from a freshly
      incremented counter") is STRONGER than CDK's replay-first ladder
      (error_codes.md prescribes no client behavior at all — this is
      implementation-defined). This scenario pins that the regeneration
      path is only taken after the original range is provably burned.

  - id: melt-fee-exceeds-reserve
    class: fault-proxy
    subset: full
    description: >-
      The authenticated fee lookup implies a fee GREATER than the quoted
      fee_reserve (recovered change is implausibly small). CDK treats
      recovered-change-implying-fee>reserve as InvalidMintResponse and
      refuses to finalize; TollGate's paymentjournal (#1231) deliberately
      records the authenticated cost in full and judges later admission
      against it. Both are defensible — corrupt-mint rejection vs
      record-reality — but the wallet must do ONE of them loudly, never
      finalize a budget that ignores the cost.
    fault:
      proxy:
        - match_path: /v1/melt
          match_method: POST
          action: drop_response
          remaining: 1
        - match_path: /v1/melt/quote
          match_method: GET
          action: status
          status_code: 200
          body: >-
            {"state": "PAID", "change": 1, "payment_proof": {"preimage":
            "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"}}
          remaining: 5
    driver:
      - Prepare an outgoing melt with fee_reserve R; the melt response is
        dropped; the shaped PAID quote implies fee >> R.
      - Observe the outcome — either a refused finalization naming the
        excessive fee (CDK behavior) or a recorded full cost that consumes
        the remaining budget headroom (TollGate #1231 behavior).
      - Trigger a subsequent outgoing admission; assert it is judged
        against the recorded full cost — the excessive fee must not
        manufacture budget headroom anywhere.
    asserts: [no-fund-loss, operator-spendable]
    notes: >-
      Differential-report material: go vs rust may legitimately diverge
      here; the invariant is that neither silently finalizes a
      cost-blind budget. Consumer wiring for #1231 is
      tollgate-module-basic-go#1231.

  - id: keyset-id-collision-quarantine
    class: adversarial-mint
    subset: full
    description: >-
      The NUT-13 deterministic-secret collision attack (conduition
      disclosure, published 2026-01): a malicious mint announces a keyset
      whose ID collides (under the wallet's derivation) with an honest
      keyset the wallet already uses, then airdrops tokens on the
      colliding keyset. A wallet keyed by the legacy reduced-resume scheme
      re-derives secrets already spent at the honest mint; the attacker
      redeems them there via NUT-09 probing. The wallet must detect the
      collision and quarantine, and the honest-mint proofs must remain
      unstealable.
    fault:
      mint_control:
        action: adversarial-keyset
        collision: legacy-residue
    driver:
      - Register honest mint M1; receive tokens on keyset K1.
      - Introduce mint M2 announcing keyset K2 crafted to collide with K1
        under the wallet's derivation keying; airdrop a token on K2.
      - Observe that the wallet quarantines or refuses K2, never merging
        it into the K1 counter space.
      - From the attacker vantage, probe M1's NUT-09 restore for the
        re-derived range — nothing new may become redeemable.
    asserts: [no-fund-loss]
    notes: >-
      Requires a mint fixture that can compute colliding keyset IDs
      (mint_control: adversarial-keyset — a new capability, lanes record
      pending-venue until a fixture provides it). Keyset-ID v2
      (HMAC-SHA256 over the full ID) is the spec'd mitigation; lanes
      running v2-only wallets still drive it to prove the quarantine
      layer exists. gonuts keyset-characterization context:
      tollgate-module-basic-go#952.

  - id: melt-quote-expiry-mid-recovery
    class: fault-proxy
    subset: full
    description: >-
      The melt quote expires while the wallet is still reconciling the
      dropped response: the wallet's quote-state lookup happens after the
      quote's TTL. The mint answers UNPAID (truthfully — the payment
      never happened). The wallet must compensate cleanly: release the
      proofs, record the operation failed, and remain retryable — an
      expired quote must not wedge the saga or leak the reservation.
    fault:
      proxy:
        - match_path: /v1/melt
          match_method: POST
          action: drop_response
          remaining: 1
        - match_path: /v1/melt/quote
          match_method: GET
          action: delay
          delay_ms: 45000
          remaining: 2
    driver:
      - Trigger an outgoing melt with a short-TTL quote; the response is
        dropped; the wallet's quote-state lookups are delayed past the
        TTL.
      - Let the mint report UNPAID after expiry.
      - Assert the proofs are released within bounded time and a retry
        with a fresh quote succeeds.
    asserts: [no-fund-loss, operator-spendable, retry-safe]
