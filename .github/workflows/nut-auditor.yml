name: NUT Auditor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mints:
        description: 'Comma-separated mint URLs'
        required: false
        default: ''
env:
  CARGO_TERM_COLOR: always
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/nut-auditor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tests/nut-auditor/Cargo.lock') }}
      - working-directory: tests/nut-auditor
        run: cargo build --release
      - name: Run audit
        working-directory: tests/nut-auditor
        run: |
          MINTS="${{ github.event.inputs.mints }}"
          if [ -z "$MINTS" ]; then
            MINTS="https://testnut.cashu.exchange https://mint.minibits.cash/Bitcoin https://nofee.testnut.cashu.space https://rugs.cashu.exchange https://rugs01.cashu.exchange https://testnut.cashudevkit.org"
          fi
          ./target/release/nut-auditor --format json $MINTS > /tmp/nut-audit-results.json
          ./target/release/nut-auditor $MINTS
      - uses: actions/upload-artifact@v4
        with:
          name: nut-audit-results
          path: /tmp/nut-audit-results.json
