# =============================================================================
# Python CI — pytest collection, unit tests, ruff, mypy
# =============================================================================
# Guards the pytest-first test framework (lib/, tests/api/, cloud lab).
# Does NOT require hardware or GCP credentials.
# =============================================================================

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python framework checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify pytest collection (all test files)
        run: pytest --collect-only -q tests/

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run conformance rails (#301 — they were never in an executed lane)
        # tests/conformance was outside testpaths and no CI step ran it:
        # the O3/O4 rails (stray-2121 sweep, tbmg parser contract) and the
        # faultproxy request-log contract were dead coverage that could
        # not fail CI. The tbmg/Go-gated tests skip cleanly where the
        # checkout/toolchain is absent; the faultproxy rails run hosted.
        run: pytest tests/conformance -q

      - name: Story/TIP coverage report
        run: |
          python3 scripts/story-coverage.py
          head -n 12 docs/user-stories.generated.md

      - name: Generated map is fresh (warning only)
        # Fails softly when marks changed without regenerating the map.
        # Phase-2 hardening candidate once marking is complete.
        continue-on-error: true
        run: |
          git checkout -- docs/user-stories.generated.md 2>/dev/null || true
          python3 scripts/story-coverage.py >/dev/null
          git diff --exit-code docs/user-stories.generated.md

      - name: Ruff lint
        run: ruff check lib/cloud_lab scripts/cloud-lab.py scripts/collect-results.py

      - name: Mypy (cloud lab + lib)
        run: mypy lib/cloud_lab scripts/cloud-lab.py
