name: Cloud Lab (SHC)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test"
        required: false
        default: ""
      branch:
        description: "Branch to test"
        required: false
        default: ""
      commit:
        description: "Commit hash (requires branch)"
        required: false
        default: ""
      backend:
        description: "Backend to test"
        type: choice
        options: [go, rust]
        default: go
      repo:
        description: "Override artifact repo"
        required: false
        default: ""
      smoke:
        description: "Smoke mode (~8min)"
        type: boolean
        default: false
      quick:
        description: "Quick mode (~5min)"
        type: boolean
        default: false
      publish:
        description: "Publish report"
        type: boolean
        default: true
      self-delete:
        description: "Cancel VM after tests"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  shc-test:
    name: "SHC cloud lab run"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          git clone --depth 1 https://github.com/Amperstrand/shc-toolkit.git /tmp/shc-toolkit
          pip install -q requests
          echo "SHC_TOOLKIT_PATH=/tmp/shc-toolkit" >> $GITHUB_ENV

      - name: Install nak CLI
        run: |
          TAG=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['tag_name'])")
          curl -sL "https://github.com/fiatjaf/nak/releases/download/${TAG}/nak-${TAG}-linux-amd64" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak
          nak --version

      - name: Configure SHC credentials
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
        run: |
          if [ -z "$SHC_API_KEY" ]; then
            echo "ERROR: SHC_API_KEY secret is not set"
            exit 1
          fi
          echo "SHC_API_KEY is set (${#SHC_API_KEY} chars)"

      - name: Generate SSH key for SHC VM
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          cp ~/.ssh/id_ed25519.pub ~/.ssh/id_rsa.pub
          echo "SSH key generated ($(ssh-keygen -l -f ~/.ssh/id_ed25519.pub))"

      - name: Write Nostr nsec
        env:
          BOT_NSEC_HEX: ${{ secrets.BOT_NSEC_HEX }}
        run: |
          mkdir -p ~/.config/prta
          echo -n "$BOT_NSEC_HEX" > ~/.config/prta/nsec
          chmod 600 ~/.config/prta/nsec

      - name: Submit SHC cloud lab run
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
          SHC_ACCOUNT_EMAIL: ${{ secrets.SHC_ACCOUNT_EMAIL }}
          SHC_ACCOUNT_PASSWORD: ${{ secrets.SHC_ACCOUNT_PASSWORD }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
          BOT_NSEC_HEX: ${{ secrets.BOT_NSEC_HEX }}
          SHC_TOOLKIT_PATH: /tmp/shc-toolkit
          EXPECTED_NPUB: 28602aa4b9a599e5fb6a1ee974dbb5447c6baab7f677803d140cdbae6fdc9010
          STRICT_NPUB_CHECK: "1"
        run: |
          ARGS=""
          [ -n "${{ inputs.pr }}" ] && ARGS="$ARGS --pr ${{ inputs.pr }}"
          [ -n "${{ inputs.branch }}" ] && ARGS="$ARGS --branch ${{ inputs.branch }}"
          [ -n "${{ inputs.commit }}" ] && ARGS="$ARGS --commit ${{ inputs.commit }}"
          [ -n "${{ inputs.repo }}" ] && ARGS="$ARGS --repo ${{ inputs.repo }}"
          [ "${{ inputs.smoke }}" = "true" ] && ARGS="$ARGS --smoke"
          [ "${{ inputs.quick }}" = "true" ] && ARGS="$ARGS --quick"
          [ "${{ inputs.publish }}" = "true" ] && ARGS="$ARGS --publish"
          [ "${{ inputs.self-delete }}" = "true" ] && ARGS="$ARGS --self-delete"

          python3 scripts/cloud-lab.py submit --cloud shc \
            --backend ${{ inputs.backend }} \
            $ARGS \
            --lease 90

      - name: Post PR comment
        if: always() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          REPO="${{ inputs.repo || 'OpenTollGate/tollgate-module-basic-go' }}"
          if [ "${{ inputs.backend }}" = "rust" ]; then
            REPO="Amperstrand/tollgate-rs-ai-research-and-experiments"
          fi

          cat <<EOF | gh pr comment "${{ inputs.pr }}" --repo "$REPO" --body-file -
          ## Cloud Lab Run (SHC)

          **Status**: ${{ job.status }}
          **Backend**: ${{ inputs.backend }}
          **Provider**: SHC (Sovereign Hybrid Compute)
          **Report**: [tests.tollgate.me](https://tests.tollgate.me/)

          Triggered by @${{ github.actor }}
          EOF
