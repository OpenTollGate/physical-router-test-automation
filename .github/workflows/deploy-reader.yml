name: Deploy Reader Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject cache-bust version
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD_SHA__/$SHA/g" docs/index.html
          echo "Cache version: $SHA"
          grep -o 'v=[a-f0-9]*' docs/index.html

      - name: Deploy reader page to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage docs/ content + CNAME into a temp dir
          mkdir /tmp/deploy
          cp -r docs/* /tmp/deploy/
          cp CNAME /tmp/deploy/ 2>/dev/null || true

          # Create orphan branch with only the reader page
          git checkout --orphan gh-pages-fresh
          git rm -rf . 2>/dev/null || true

          # Copy reader page content
          cp -r /tmp/deploy/* .
          git add -A
          git commit -m "deploy: reader page $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages-fresh:gh-pages --force
