# =============================================================================
# Cloud Lab CI — Ephemeral self-hosted runner dispatch
# =============================================================================
# Triggers a TollGate cloud lab run on GCP using a JIT-configured ephemeral
# GitHub Actions runner. The workflow:
#   1. Authenticates to GCP via service account
#   2. Resolves target (PR/branch/commit) and waits for upstream CI artifact
#   3. Generates a JIT runner config via the GitHub API
#   4. Creates a GCP VM from the baked runner snapshot with the JIT config
#   5. VM boots, registers as a self-hosted runner, and executes cloud-lab-runner.yml
#   6. Optionally blocks until the VM finishes (--wait)
#
# The actual test execution happens in .github/workflows/cloud-lab-runner.yml,
# which runs on the self-hosted [cloud-lab] runner inside the GCP VM.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   GCP_SERVICE_ACCOUNT_KEY  — base64-encoded GCP service account JSON key
#   CROSS_REPO_TOKEN         — GitHub PAT for cross-repo artifact download + PR comments
#
# One-off launch:
#   gh workflow run cloud-lab.yml --field pr=42 --field publish=true
#   gh workflow run cloud-lab.yml --field branch=main --field publish=true
# =============================================================================

name: Cloud Lab

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test (mutually exclusive with branch/commit)"
        required: false
        default: ""
      branch:
        description: "Branch to test (mutually exclusive with pr/commit)"
        required: false
        default: ""
      commit:
        description: "Commit hash to test (requires --branch)"
        required: false
        default: ""
      backend:
        description: "Backend to test"
        type: choice
        options: [go, rust]
        default: go
      repo:
        description: "Override artifact repo (e.g. Amperstrand/tollgate-module-basic-go)"
        required: false
        default: ""
      publish:
        description: "Publish report to tests.tollgate.me"
        type: boolean
        default: true
      wait:
        description: "Block until VM finishes (else fire-and-forget)"
        type: boolean
        default: true
      smoke:
        description: "Smoke mode: visual + smoke API only (~8min)"
        type: boolean
        default: false
      quick:
        description: "Quick mode: visual happy path only (~5min)"
        type: boolean
        default: false
      hwsim:
        description: "Enable mac80211_hwsim virtual WiFi"
        type: boolean
        default: false
      vwifi:
        description: "Enable vwifi cross-VM WiFi relay"
        type: boolean
        default: false
      two-router:
        description: "Boot second OpenWrt VM for two-router tests"
        type: boolean
        default: false
      reseller-scenarios:
        description: "Run virtualizable reseller-mode scenario tests"
        type: boolean
        default: false
      self-delete:
        description: "Self-delete VM after tests (default: keep for debugging)"
        type: boolean
        default: false
      artifact-timeout:
        description: "Seconds to wait for upstream CI artifact"
        type: number
        default: 1800

permissions:
  contents: write   # needed for gh-pages push from runner
  actions: read     # needed for artifact download + runner management

jobs:
  dispatch:
    name: "Dispatch cloud lab run"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.spawn.outputs.run_id }}
      vm_name: ${{ steps.spawn.outputs.vm_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: gcloud config set project tollgate-test-lab

      # Step 1: Resolve target (PR/branch/commit) and wait for upstream CI artifact
      - name: Resolve target and wait for CI artifact
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          python3 -c "
          import json, sys
          from lib.cloud_lab.resolve import resolve_target
          from lib.cloud_lab.artifact import ensure_target_artifact

          pr = '${{ inputs.pr }}' or None
          branch = '${{ inputs.branch }}' or None
          commit = '${{ inputs.commit }}' or None
          backend = '${{ inputs.backend }}'
          repo_override = '${{ inputs.repo }}' or None
          timeout_s = ${{ inputs.artifact-timeout }}

          target = resolve_target(
              pr=pr, branch=branch, commit=commit,
              backend=backend, repo_override=repo_override,
          )
          print(f'Resolved: {target.repo}@{target.branch} (commit={target.sut_commit[:7] if target.sut_commit else \"unknown\"})')

          artifact_run_id = ensure_target_artifact(target, timeout_s=timeout_s)
          print(f'Artifact from CI run: {artifact_run_id}')

          # Output all fields for downstream steps
          with open('/tmp/resolve-output.json', 'w') as f:
              json.dump({
                  'repo': target.repo,
                  'branch': target.branch,
                  'sut_commit': target.sut_commit,
                  'pr': target.pr or '',
                  'backend': target.backend,
                  'pr_repo': target.pr_repo or target.repo,
                  'artifact_run_id': artifact_run_id,
              }, f)

          # Also set GITHUB_OUTPUT for direct use
          from pathlib import Path
          gho = Path('/tmp/gh-resolve-output')
          gho.write_text(
              f'repo={target.repo}\n'
              f'branch={target.branch}\n'
              f'sut_commit={target.sut_commit}\n'
              f'pr={target.pr or \"\"}\n'
              f'backend={target.backend}\n'
              f'pr_repo={target.pr_repo or target.repo}\n'
              f'artifact_run_id={artifact_run_id}\n'
          )
          "
          # Parse outputs into GITHUB_OUTPUT
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/gh-resolve-output
          echo "Resolved target: ${{ steps.resolve.outputs.repo }}@${{ steps.resolve.outputs.branch }}"

      # Step 2: Generate JIT runner config via GitHub API
      # Requires a PAT with repo admin scope — GITHUB_TOKEN cannot call generate-jitconfig (HTTP 403)
      - name: Generate JIT runner config
        id: jit
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          RUNNER_NAME="tollgate-${{ github.run_id }}"
          echo "Generating JIT config for runner: ${RUNNER_NAME}"

          # generate-jitconfig creates an ephemeral runner registration token
          # encoded as a single-use config string. The runner uses this to
          # authenticate with GitHub Actions without a persistent PAT.
          RESP=$(gh api -X POST \
            /repos/${{ github.repository }}/actions/runners/generate-jitconfig \
            --input - <<'JSON' | jq -r '.encoded_jit_config'
          {"name":"'"$RUNNER_NAME"'","runner_group_id":1,"labels":["cloud-lab"]}
          JSON
          )

          if [ -z "$RESP" ] || [ "$RESP" = "null" ]; then
            echo "ERROR: Failed to generate JIT config (empty or null)"
            exit 1
          fi

          # Mask the JIT config — it's a secret credential
          echo "::add-mask::${RESP}"
          echo "jit_config=${RESP}" >> "$GITHUB_OUTPUT"
          echo "JIT config generated successfully"

      # Step 3: Generate run_id for this dispatch
      - name: Generate run ID
        id: runid
        run: |
          python3 -c "
          from datetime import datetime, timezone
          commit_short = '${{ steps.resolve.outputs.sut_commit }}'[:7].replace('/', '-')
          timestamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          run_id = f'{timestamp}-{commit_short}'
          from pathlib import Path
          Path('/tmp/gh-runid-output').write_text(f'run_id={run_id}\n')
          "
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/gh-runid-output
          echo "Run ID: ${{ steps.runid.outputs.run_id }}"

      # Step 4: Trigger runner workflow FIRST so the job is queued
      # when the VM boots and the runner agent registers.
      # This avoids the race where the VM boots, the JIT runner
      # finds no job, and exits before the workflow is dispatched.
      - name: Trigger runner workflow
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          echo "Triggering cloud-lab-runner.yml (job will queue until runner registers)..."
          gh workflow run cloud-lab-runner.yml \
            --field run_id="${{ steps.runid.outputs.run_id }}" \
            --field backend="${{ inputs.backend }}" \
            --field artifact_repo="${{ steps.resolve.outputs.repo }}" \
            --field artifact_run_id="${{ steps.resolve.outputs.artifact_run_id }}" \
            --field artifact_branch="${{ steps.resolve.outputs.branch }}" \
            --field artifact_commit="${{ steps.resolve.outputs.sut_commit }}" \
            --field pr_number="${{ steps.resolve.outputs.pr }}" \
            --field pr_repo="${{ steps.resolve.outputs.pr_repo }}" \
            --field publish="${{ inputs.publish }}" \
            --field smoke="${{ inputs.smoke }}" \
            --field quick="${{ inputs.quick }}" \
            --field hwsim="${{ inputs.hwsim }}" \
            --field vwifi="${{ inputs.vwifi }}" \
            --field two-router="${{ inputs.two-router }}" \
            --field reseller-scenarios="${{ inputs.reseller-scenarios }}"
          echo "Runner workflow triggered — waiting 15s for job to queue..."
          sleep 15

      # Step 5: Create GCP VM with JIT config — runner picks up the queued job immediately
      - name: Spawn runner VM
        id: spawn
        env:
          JIT_CONFIG: ${{ steps.jit.outputs.jit_config }}
        run: |
          python3 -c "
          import json, os
          from lib.cloud_lab.gcp import submit_runner

          info = submit_runner(
              encoded_jit_config=os.environ['JIT_CONFIG'],
              run_id='${{ steps.runid.outputs.run_id }}',
              keep_vm_on_failure='${{ inputs.self-delete }}' == 'false',
          )

          from pathlib import Path
          gho = Path('/tmp/gh-spawn-output')
          gho.write_text(
              f'run_id={info[\"run_id\"]}\n'
              f'vm_name={info[\"vm_name\"]}\n'
              f'project={info[\"project\"]}\n'
              f'zone={info[\"zone\"]}\n'
          )
          "
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/gh-spawn-output
          echo "Runner VM spawned: ${{ steps.spawn.outputs.vm_name }}"

      # Step 6: Wait for the runner job to complete (optional, blocking)
      - name: Wait for runner job
        if: inputs.wait == true
        run: |
          VM_NAME="${{ steps.spawn.outputs.vm_name }}"
          PROJECT="${{ steps.spawn.outputs.project }}"
          ZONE="${{ steps.spawn.outputs.zone }}"

          echo "Waiting for runner VM ${VM_NAME} to finish (polling every 30s)..."
          echo "Logs: gcloud compute ssh ${VM_NAME} --project=${PROJECT} --zone=${ZONE} --command='tail -f /var/log/runner-startup.log'"

          # Poll until VM is deleted or timeout (90min)
          elapsed=0
          max_seconds=5400
          while [ $elapsed -lt $max_seconds ]; do
            if ! gcloud compute instances describe "$VM_NAME" \
              --project="$PROJECT" --zone="$ZONE" \
              --format="get(status)" 2>/dev/null; then
              echo "VM ${VM_NAME} deleted — runner job finished."
              exit 0
            fi
            sleep 30
            elapsed=$((elapsed + 30))
            echo "Still running... (${elapsed}s / ${max_seconds}s)"
          done
          echo "WARNING: Timeout waiting for VM after $((max_seconds / 60)) minutes."
          echo "The VM may still be running. Check logs manually."

      # Step 5: Post PR comment with results (same pattern as original workflow)
      - name: Post PR comment with results
        if: always() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          RUN_ID="${{ steps.spawn.outputs.run_id || 'unknown' }}"
          BACKEND="${{ inputs.backend }}"
          REPO="OpenTollGate/tollgate-module-basic-go"
          if [ "$BACKEND" = "rust" ]; then
            REPO="Amperstrand/tollgate-rs-ai-research-and-experiments"
          fi

          # Try to get commit short hash for report URL
          COMMIT_SHORT="${{ steps.resolve.outputs.sut_commit }}"
          if [ -n "$COMMIT_SHORT" ]; then
            COMMIT_SHORT="${COMMIT_SHORT:0:7}"
          else
            COMMIT_SHORT=$(gh pr view "${{ inputs.pr }}" --repo "$REPO" --json headRefOid -q '.headRefOid' 2>/dev/null | cut -c1-7 || echo "unknown")
          fi

          REPORT_URL="https://tests.tollgate.me/reports/${COMMIT_SHORT}/${RUN_ID}/report/index.html"
          DASHBOARD_URL="https://tests.tollgate.me/"

          cat <<EOF | gh pr comment "${{ inputs.pr }}" --repo "$REPO" --body-file -
          ## Cloud Lab Run: \`${RUN_ID}\`

          **Status**: ${{ job.status }}
          **Backend**: ${BACKEND}
          **Runner**: ephemeral JIT (self-hosted on GCP)
          **Report**: [${REPORT_URL}](${REPORT_URL})
          **Dashboard**: [tests.tollgate.me](${DASHBOARD_URL})

          Triggered by @${{ github.actor }} via workflow dispatch.
          EOF

      - name: Upload dispatch output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-lab-dispatch-output
          path: |
            /tmp/resolve-output.json
            /tmp/gh-resolve-output
            /tmp/gh-spawn-output
          retention-days: 30
          if-no-files-found: ignore
