# =============================================================================
# GitHub Actions CI Workflow for Physical Router Test Automation
# =============================================================================
# HOSTED-ONLY. This workflow is reachable from `pull_request`, so every job in
# it must be safe to run against a contributor's PR code: GitHub-hosted
# runners, read-only, no secrets, no bench access.
#
# Bench / hardware work lives in `.github/workflows/hw-smoke.yml`, which has NO
# pull_request trigger (workflow_dispatch plus a dormant schedule) and keeps its
# mutating lane behind the `bench-hardware` environment.
#
# Why the split is not optional: a `pull_request` trigger plus a
# `[self-hosted, tollgate-router]` runner means any contributor's PR executes on
# the machine that flashes routers, holds the repo secrets and sits in the
# bench's L1/L2 neighbourhood — arbitrary code execution next to real hardware.
# The old `test-ui` / `test-physical` jobs here were exactly that, parked behind
# `if: false`; the benches' WiFi-client and data-allotment specs also forced
# themselves on, mutating router state and burning paid traffic.
#
# The separation is enforced mechanically on every PR by the
# "Workflow hardware-lane isolation guard" step below
# (scripts/ci/check-workflow-hw-isolation.sh, self-tested by
# scripts/ci/test-check-workflow-hw-isolation.sh). Moving a self-hosted job back
# into this file fails the PR.
#
# Jobs:
#   1. lint     — code quality, test collection, isolation guard
#                 (ubuntu-latest, always runs)
#   2. publish  — GitHub Pages test report after a main push
#                 (ubuntu-latest, push-to-main only, opt-in via the
#                 PUBLISH_TEST_REPORTS repo variable)
# =============================================================================

name: CI

on:
  # Trigger on push to main branch
  push:
    branches: [main]
  # Trigger on pull requests to main branch
  pull_request:
    branches: [main]
  # Allow manual dispatch for testing specific commits
  workflow_dispatch:
    inputs:
      tollgate_commit:
        description: 'TollGate commit hash to test'
        required: false
        default: ''
      viewport:
        description: 'Viewport (desktop or mobile)'
        required: false
        default: 'desktop'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Job 1: Lint/Collect Tests
# =============================================================================
# Runs on standard GitHub-hosted ubuntu-latest runner (no hardware needed).
# Safe for untrusted PR code: read-only token, no secrets, no `runs-on:
# self-hosted`.
# =============================================================================
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout repository code
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Set up Node.js 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install dependencies
      - run: npm install

      # Install Playwright browsers and dependencies
      - run: npx playwright install --with-deps

      # Verify test collection (no hardware needed)
      - name: Verify test collection
        run: npm run test:list

      # Check that all helper modules can be imported
      - name: Check imports
        run: |
          node -e "Promise.all([
            './tests/helpers/command.mjs',
            './tests/helpers/inventory.mjs',
            './tests/helpers/ssh.mjs',
            './tests/helpers/network.mjs',
            './tests/helpers/router-config.mjs',
            './tests/helpers/payment-protocol.mjs'
          ].map(p=>import(p))).then(()=>console.log('all helpers import OK'))"

      # Fail the PR if any workflow reachable from pull_request can touch the
      # bench, if the hardware workflow gains a PR trigger, or if a job is parked
      # behind `if: false`.
      - name: Workflow hardware-lane isolation guard
        run: bash scripts/ci/check-workflow-hw-isolation.sh

      # Prove the guard itself can fail (fixture injections onto the real tree).
      - name: Guard self-test
        run: bash scripts/ci/test-check-workflow-hw-isolation.sh

# =============================================================================
# Job 2: Publish Test Report (Main Branch Only)
# =============================================================================
# Publishes the test report to GitHub Pages after a successful main push.
#
# `needs` is the hosted `lint` job, NOT a hardware job: depending on a job whose
# own `if:` is false silently skips the dependent job too, which is how this
# lane became dead without anybody noticing.
#
# It stays opt-in behind the PUBLISH_TEST_REPORTS repo variable because the
# report lane is not yet runnable from a hosted runner: scripts/run-tests.sh
# delegates to scripts/run-profile.sh, which requires a Python venv at
# $HOME/.tollgate-test-venv that no step here creates, and the bench URL in
# TOLLGATE_LUCI_URL is LAN-only. Set the variable only after that lane has a
# venv bootstrap and a reachable target.
# =============================================================================
  publish:
    needs: [lint]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.PUBLISH_TEST_REPORTS == 'true'
    runs-on: ubuntu-latest
    env:
      # Enable publish mode
      TOLLGATE_PUBLISH: true
      # Keep last 20 reports on GitHub Pages
      TOLLGATE_GH_PAGES_KEEP: 20
      TOLLGATE_LUCI_URL: ${{ secrets.TOLLGATE_LUCI_URL }}
      TOLLGATE_LUCI_USER: ${{ secrets.TOLLGATE_LUCI_USER }}
      TOLLGATE_LUCI_PASSWORD: ${{ secrets.TOLLGATE_LUCI_PASSWORD }}
    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Set up Node.js 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install dependencies
      - run: npm install

      # Install Playwright browsers and dependencies
      - run: npx playwright install --with-deps

      # Run tests and publish report
      # Uses manual dispatch commit if provided, otherwise current commit
      - name: Run tests and publish report
        run: bash scripts/run-tests.sh ${{ github.event.inputs.tollgate_commit || github.sha }} desktop
