name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"

jobs:
  gitleaks:
    # Org-wide reusable scanner (single definition, OpenTollGate/.github —
    # ported from Amperstrand/.github#1 in the tollgate consolidation #758;
    # this repo's rules/allowlists live in the .gitleaks.toml beside this).
    uses: OpenTollGate/.github/.github/workflows/gitleaks.yml@main
