[mypy]
python_version = 3.12
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-tests.*]
ignore_errors = true

# Pre-existing type errors in pulumi modules (not related to PR #78)

[mypy-lib.cloud_lab.pulumi_submit]
ignore_errors = true

[mypy-lib.cloud_lab.pulumi_runner]
ignore_errors = true
