# Single source of truth for this repo's gitleaks rules + allowlists.
# The scanner definition is org-level (OpenTollGate/.github, the
# tollgate-module-basic-go#758 consolidation); this file is picked up
# automatically. The extend header is REQUIRED — without it this file
# silently REPLACES the default ruleset.
[extend]
useDefault = true

[allowlist]
description = "PRTA allowlist (empty until first triaged finding)"
paths = []
