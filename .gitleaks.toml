# gitleaks allowlist — every entry has a reason and a destination.
# Entries without a tracking destination get deleted, not extended.
#
# NOTE: a repo config REPLACES gitleaks' built-in ruleset unless it
# explicitly extends it — before [extend] useDefault was added, every
# scan using this config ran with ZERO detection rules (the allowlists
# below were muting a scanner that could not detect anything).
[extend]
useDefault = true


# Commit-scoping doctrine for incident entries: the finding is silenced in
# exactly the commit that introduced it, so the PATH stays armed — a re-added
# file under the same name trips the scanner again (verified on gitleaks
# 8.30.1, OpenTollGate/tollgate-module-basic-go#764 / issue #202).
# mint-health/routers.env carries no entry: its values are formatless
# (invisible to pattern rules) — the gitignore env-class rules are the
# primary defense for that file.
[[allowlists]]
description = "Incident: historical backup of lab router credentials, committed 2026-07-01 (9571be288) and untracked since (b26cd111). The password is publicly retrievable from git history until the lab routers are verified/rotated — tracked in the audit issue. Commit-scoped to the introduction commit: a re-added .env.lab-routers-backup anywhere flags again."
commits = ['''9571be288faf9805d6f0218f41100844765dbbe9''']

[[allowlists]]
description = "Cashu test fixtures: literal fake tokens and base64 demo payloads in unit/API tests and scripts (verify-issue5-v4.mjs TEST_TOKEN, secret-scanner fixtures, portal demoToken, compat-matrix classification strings)."
regexTarget = "match"
regexes = [
  '''cashuBtest123XYZ''',
  '''cashuAeyJ0b2tlbiI6W3sibWludCI6[a-zA-Z0-9+/=]*''',
  '''cashuAeyJ1bml0Ijoi[a-zA-Z0-9+/=.]*''',
  '''eyJwcm9vZiI6ICIiLCAicHJvb2ZzIjogW3siaWQi[a-zA-Z0-9+/=]*''',
  '''garbage/empty/duplicate''',
  '''CashuMint-V1''',
]

[[allowlists]]
description = "Sample/dummy values: the Sec-WebSocket-Key sample nonce (base64 of 'the sample nonce') in nut-auditor types, the token-recovery test hex, and the keyboard-mash example password in firmware docs."
regexTarget = "match"
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''0279110f[a-f0-9]*''',
  '''aB3xK9mQ2pR7vN5tW1cY''',
]
