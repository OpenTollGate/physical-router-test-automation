---
# film_voice — provision the offline Kokoro-82M narration backend.
#
# Any test lane that recorded footage plus a narration timeline can then
# narrate it (lib/film_voice.py, scripts/film-narrate.py). Inputs are pinned:
# the model and the voice pack are fetched once and verified by sha256, and
# the tools come from this repository (tools/film/).

film_voice_root: /opt/film-voice
film_voice_venv: "{{ film_voice_root }}/venv"
film_voice_models: "{{ film_voice_root }}/models"
film_voice_bin: /usr/local/bin

# The vendored film tools (see tools/film/PROVENANCE.md). Run the playbook
# from the repository root so this relative path resolves.
film_tools_src: "{{ playbook_dir }}/../tools/film"

# Pinned model inputs (thewh1teagle/kokoro-onnx, model-files-v1.0).
kokoro_model_url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
kokoro_model_sha256: "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5"
kokoro_voices_url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
kokoro_voices_sha256: "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"

# One voice per audience level, kept stable across a series
# (docs/film-lane.md). af_heart is Kokoro v1.0's reference voice.
kokoro_voice: af_heart
kokoro_lang: en-us
kokoro_speed: "1.0"
