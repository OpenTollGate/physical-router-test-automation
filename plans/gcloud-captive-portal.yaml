name: gcloud-captive-portal
description: "Full captive portal suite against GCloud virtual lab"
matrix:
  lab: gcloud
  tier: captive-portal
  scope: full
runner: pytest
pytest:
  markers: "phone and extended"
  testpaths: "tests/phone"
playwright: null
env:
  TOLLGATE_VIRTUAL_LAB: "true"
  TOLLGATE_CLIENT_TYPE: container
